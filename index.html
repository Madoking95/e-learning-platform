<!DOCTYPE html>
<html>
<head>
  <title>E-Learning Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>E-Learning Platform</h1>

<input type="text" id="search" placeholder="Search courses...">

<div id="courseList"></div>

<button onclick="toggleDarkMode()">Toggle Dark Mode</button>

<script>
const courses = [
  {
    name: "JavaScript Basics",
    progress: 0,
    img: "https://cdn-icons-png.flaticon.com/512/5968/5968292.png",
    link: "https://www.w3schools.com/js/"
  },
  {
    name: "HTML & CSS",
    progress: 0,
    img: "https://cdn-icons-png.flaticon.com/512/732/732212.png",
    link: "https://www.w3schools.com/html/"
  },
  {
    name: "Python Beginner",
    progress: 0,
    img: "https://cdn-icons-png.flaticon.com/512/5968/5968350.png",
    link: "https://www.w3schools.com/python/"
  },
   {
    name: "C Programming",
    progress: 0,
    img: "https://cdn-icons-png.flaticon.com/512/6132/6132222.png",
    link: "https://www.w3schools.com/c/"
  },
  {
    name: "C++ Programming",
    progress: 0,
    img: "https://cdn-icons-png.flaticon.com/512/6132/6132221.png",
    link: "https://www.w3schools.com/cpp/"
  },
  {
    name: "Java Programming",
    progress: 0,
    img: "https://cdn-icons-png.flaticon.com/512/226/226777.png",
    link: "https://www.w3schools.com/java/"
  }
   {
    name: "My SQL",
    progress: 0,
    img: "https://media.licdn.com/dms/image/v2/D4D12AQGDQQGDyBwIfg/article-cover_image-shrink_720_1280/B4DZmaCgLFGgAI-/0/1759225973086?e=2147483647&v=beta&t=TwwNhxGrlnPiOKrH1dDjSVVALliW025fHghZvPZsP5M",
    link: "https://www.w3schools.com/mysql/default.asp"
  }
];

function displayCourses(data) {
  let container = document.getElementById("courseList");
  container.innerHTML = "";

  data.forEach(course => {
    container.innerHTML += `
      <div class="course">
        <img src="${course.img}" width="100">
        <h3>${course.name}</h3>
        <p>Progress: ${course.progress}%</p>
        <button onclick="openCourse('${course.link}')">Start</button>
      </div>
    `;
  });
}

displayCourses(courses);

function openCourse(link) {
  window.location.href = link; // mobile e 100% kaj korbe
}

document.getElementById("search").addEventListener("input", function() {
  let value = this.value.toLowerCase();
  let filtered = courses.filter(c =>
    c.name.toLowerCase().includes(value)
  );
  displayCourses(filtered);
});

function toggleDarkMode() {
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
